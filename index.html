<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播运营中心 · LiveOps Console</title>
<style>
:root{
  --bg:#f7f9fc; --panel:#ffffff; --panel2:#f0f3f9; --card:#ffffff; --border:#e6eaf0;
  --line:#eef1f6; --text:#1f2937; --muted:#6b7280; --dim:#9ca3af;
  --red:#ff5a7d; --red2:#ff7a95; --cyan:#a78bfa; --cyan2:#c4b5fd;
  --green:#10b981; --amber:#f59e0b; --orange:#fb923c;
  --grad:linear-gradient(135deg,#ff6b9d 0%,#c084fc 50%,#818cf8 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,107,157,.10),rgba(129,140,248,.08));
  --radius:18px; --shadow:0 4px 24px rgba(99,102,241,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(167,139,250,.25)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d8dce4;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#c2c8d2}
::-webkit-scrollbar-track{background:transparent}
#loginView{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 520px at 12% -8%,rgba(255,107,157,.18),transparent 55%),
    radial-gradient(820px 500px at 108% 108%,rgba(192,132,252,.16),transparent 55%),
    radial-gradient(600px 420px at 55% 118%,rgba(129,140,248,.14),transparent 60%),#f7f9fc;z-index:100}
#loginView::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 30%,transparent 75%);pointer-events:none}
.login-box{width:420px;max-width:92vw;background:#ffffff;border:1px solid #ece8f0;border-radius:22px;padding:46px 42px;
  box-shadow:0 20px 60px rgba(99,102,241,.10),0 4px 16px rgba(192,132,252,.08);position:relative;overflow:hidden}
.login-box::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(192,132,252,.6),transparent)}
.login-box::after{content:"";position:absolute;top:-120px;right:-120px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,107,157,.12),transparent 70%);pointer-events:none}
.logo{display:flex;align-items:center;gap:13px;margin-bottom:6px;position:relative;z-index:1}
.logo .mark{width:46px;height:46px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(192,132,252,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.logo .mark svg{display:block}
.logo .t{font-size:22px;font-weight:800;letter-spacing:.4px;color:var(--text)}
.logo .t span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-box .sub{color:var(--muted);font-size:12.5px;margin-bottom:30px;letter-spacing:.2px;position:relative;z-index:1}
.field{margin-bottom:18px;position:relative;z-index:1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.field input{width:100%;background:var(--panel2);border:1px solid #e2e6ed;border-radius:12px;
  padding:13px 15px;color:var(--text);font-size:14px;outline:none;transition:.18s}
.field input::placeholder{color:var(--dim)}
.field input:hover{border-color:#c4b5fd}
.field input:focus{border-color:var(--cyan);background:#fff;box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.btn-login{width:100%;background:var(--grad);color:#fff;border:none;border-radius:12px;padding:14px;
  font-size:15px;font-weight:700;letter-spacing:2px;transition:.18s;position:relative;z-index:1;
  box-shadow:0 8px 24px rgba(192,132,252,.32)}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(192,132,252,.42);filter:brightness(1.05)}
.btn-login:active{transform:translateY(0)}
.login-err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:12px;text-align:center}
.login-hint{margin-top:20px;padding:13px 15px;background:var(--panel2);border:1px solid #e8eaf0;border-radius:12px;font-size:12px;color:var(--muted);position:relative;z-index:1}
.login-hint b{color:var(--cyan)}
.login-hint a{color:var(--cyan)}
#app{display:none;height:100vh;flex-direction:column;background:var(--bg)}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0}
.topbar .logo{display:flex;align-items:center;gap:10px;margin:0}
.topbar .logo .mark{width:32px;height:32px;border-radius:9px;box-shadow:0 4px 14px rgba(192,132,252,.32)}
.topbar .logo .t{font-size:15.5px;letter-spacing:.3px}
.topbar .spacer{flex:1}
.topbar .user{display:flex;align-items:center;gap:10px}
.topbar .avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 4px 12px rgba(192,132,252,.35)}
.topbar .uname{font-size:13px;font-weight:600;color:var(--text)}
.topbar .role-tag{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
.role-admin{background:rgba(255,90,125,.13);color:#e9436a}
.role-editor{background:rgba(167,139,250,.16);color:#7c6ce8}
.role-viewer{background:rgba(107,114,128,.13);color:var(--muted)}
.role-store{background:rgba(99,102,241,.13);color:#5158d4}
.btn-logout{background:#fff;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:7px 14px;font-size:12.5px;transition:.15s}
.btn-logout:hover{color:#e9436a;border-color:#f5b3c0;background:#fdf2f4}
.body{flex:1;display:flex;overflow:hidden}
.sidebar{width:222px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;flex-shrink:0}
.sidebar .group{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1.4px;margin:16px 12px 8px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:11px;color:var(--muted);
  font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:.14s}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--grad-soft);color:#5158d4;position:relative;font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--grad)}
.nav-item .ic{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .ic svg{width:18px;height:18px;display:block}
.main{flex:1;overflow-y:auto;padding:26px 30px 60px}
.h-title{font-size:21px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;color:var(--text)}
.h-title .tag{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--grad);color:#fff;letter-spacing:.5px}
.h-sub{color:var(--muted);font-size:13px;margin:6px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;
  box-shadow:0 1px 3px rgba(99,102,241,.04)}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.card .desc{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.sidebar{width:64px}.nav-item span.txt{display:none}.nav-item .ic{width:22px;height:22px}.nav-item .ic svg{width:20px;height:20px}.nav-item{justify-content:center;padding:11px}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;
  box-shadow:0 1px 3px rgba(99,102,241,.04)}
.kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.3px}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .val.accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpi .mom{font-size:11.5px;margin-top:8px;display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-weight:700}
.up{color:#0d9668;background:rgba(16,185,129,.12)}
.down{color:#e9436a;background:rgba(255,90,125,.12)}
.flat{color:var(--muted);background:rgba(107,114,128,.12)}
.kpi::after{content:"";position:absolute;right:-20px;bottom:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.12),transparent 70%)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11px;position:sticky;top:0;z-index:2;letter-spacing:.3px}
tbody tr:hover{background:rgba(192,132,252,.04)}
.tnum{font-variant-numeric:tabular-nums;text-align:right}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.3px}
.b-red{background:rgba(255,90,125,.13);color:#e9436a}
.b-green{background:rgba(16,185,129,.13);color:#0d9668}
.b-cyan{background:rgba(167,139,250,.15);color:#7c6ce8}
.b-amber{background:rgba(245,158,11,.14);color:#d97706}
.b-dim{background:rgba(107,114,128,.13);color:var(--muted)}
.chart-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.chart-box .ct{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--text)}
.chart-box .cd{font-size:11.5px;color:var(--dim);margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:8px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel .frow{display:flex;align-items:center;gap:12px}
.funnel .fl{width:120px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
.funnel .fbar{flex:1;height:34px;background:var(--panel2);border-radius:8px;overflow:hidden;position:relative}
.funnel .fbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--grad);opacity:.9}
.funnel .fv{width:150px;font-size:12px;color:var(--text);flex-shrink:0}
.diag-section{border-left:3px solid var(--red);background:var(--panel2);border-radius:0 12px 12px 0;padding:16px 18px;margin:14px 0}
.diag-section.cyan{border-color:var(--cyan)}
.diag-section.amber{border-color:var(--amber)}
.diag-section.green{border-color:var(--green)}
.diag-section h4{font-size:14px;font-weight:800;margin-bottom:8px;color:var(--text)}
.diag-section .item{font-size:13px;margin-bottom:7px;line-height:1.65;color:var(--text)}
.p0{color:#e9436a}.p1{color:#d97706}.p2{color:#7c6ce8}
.prio-tag{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:5px;margin-right:7px}
.pt0{background:rgba(255,90,125,.14);color:#e9436a}
.pt1{background:rgba(245,158,11,.14);color:#d97706}
.pt2{background:rgba(167,139,250,.16);color:#7c6ce8}
textarea,.inp,.sel{width:100%;background:var(--panel2);border:1px solid #e2e6ed;border-radius:12px;
  padding:12px 14px;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:.15s}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}
textarea:focus,.inp:focus,.sel:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(167,139,250,.18);background:#fff}
.sel option{background:var(--panel);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;border:none;border-radius:11px;
  padding:11px 20px;font-size:13.5px;font-weight:700;transition:.16s;box-shadow:0 6px 20px rgba(192,132,252,.30)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(192,132,252,.42);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border);box-shadow:0 1px 2px rgba(99,102,241,.04)}
.btn.ghost:hover{background:var(--panel2);color:#5158d4;border-color:#c4b5fd;box-shadow:none;transform:none;filter:none}
.btn.cyan{background:linear-gradient(135deg,#a78bfa,#c4b5fd);color:#fff}
.btn.cyan:hover{box-shadow:0 10px 28px rgba(167,139,250,.4)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.hint{font-size:12px;color:var(--dim);margin:8px 0}
.callout{border-left:3px solid var(--red);background:rgba(255,90,125,.06);border-radius:0 12px 12px 0;padding:14px 18px;margin:12px 0;color:var(--text)}
.callout.cyan{border-color:var(--cyan);background:rgba(167,139,250,.07)}
.callout.amber{border-color:var(--amber);background:rgba(245,158,11,.07)}
.callout.green{border-color:var(--green);background:rgba(16,185,129,.07)}
.callout b{display:block;margin-bottom:4px}
.user-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.user-row .av{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.user-row .info{flex:1}
.user-row .nm{font-size:14px;font-weight:700;color:var(--text)}
.user-row .rm{font-size:12px;color:var(--muted)}
.mini-btn{background:#fff;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 11px;font-size:12px;transition:.15s}
.mini-btn:hover{color:#e9436a;border-color:#f5b3c0}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(99,102,241,.04)}
.kb-card h4{font-size:13.5px;font-weight:800;margin-bottom:8px;color:#5158d4}
.kb-card ul{margin-left:17px;font-size:12.5px;color:var(--muted)}
.kb-card li{margin-bottom:5px;color:var(--text)}
.ai-chat{margin-top:10px}
.ai-out{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:80px;font-size:13px;line-height:1.75;white-space:pre-wrap;margin-top:12px;max-height:460px;overflow-y:auto;color:var(--text)}
.typing{color:var(--cyan);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.modal{position:fixed;inset:0;background:rgba(31,41,55,.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200}
.modal.show{display:flex}
.modal-box{width:460px;max-width:92vw;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.modal-box h3{font-size:17px;margin-bottom:18px;color:var(--text)}
.footer-note{text-align:center;color:var(--dim);font-size:12px;padding:26px 0;border-top:1px solid var(--line);margin-top:30px}
.spark{display:flex;align-items:flex-end;gap:3px;height:40px;margin:8px 0}
.spark i{flex:1;background:var(--cyan);border-radius:3px 3px 0 0;min-height:3px}
.spark i.dn{background:var(--red)}
.trend-chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
</style>


</head>
<body>

<!-- 登录页 -->
<div id="loginView">
  <div class="login-box">
    <div class="logo">
      <div class="mark"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.3 6.1v9.8l8.4-4.9L8.3 6.1z" fill="#ffffff"/></svg></div>
      <div class="t">直播运营<span>中心</span></div>
    </div>
    <div class="sub" id="loginSub">LiveOps Console · 跨境电商直播复盘与诊断平台</div>
    <!-- 登录表单 -->
    <div id="loginForm">
      <div class="field"><label>账号</label><input id="loginUser" placeholder="请输入账号" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="loginPwd" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <button class="btn-login" onclick="doLogin()">登 录</button>
      <div class="login-err" id="loginErr"></div>
    </div>
    <!-- 注册表单 -->
    <div id="registerForm" style="display:none">
      <div class="field"><label>姓名</label><input id="regName" placeholder="请输入真实姓名"></div>
      <div class="field"><label>登录账号</label><input id="regUser" placeholder="设置登录账号"></div>
      <div class="field"><label>密码</label><input id="regPwd" type="password" placeholder="至少 6 位"></div>
      <div class="field"><label>确认密码</label><input id="regPwd2" type="password" placeholder="再次输入密码"></div>
      <div class="field"><label>申请说明（部门 / 用途，选填）</label><input id="regNote" placeholder="例如：运营B部 · 母婴组"></div>
      <button class="btn-login" onclick="doRegister()">提交注册申请</button>
      <div class="login-err" id="regErr"></div>
    </div>
    <div class="login-hint" id="loginHint">仅限授权人员使用 · 账号权限由总负责人分配<br><a style="color:var(--cyan);cursor:pointer" onclick="showRegister()">没有账号？点击注册</a>　·　<a style="color:var(--cyan);cursor:pointer" onclick="forgotPwd()">忘记密码？</a></div>
  </div>
</div>

<!-- 主应用 -->
<div id="app">
  <div class="topbar">
    <div class="logo">
      <div class="mark"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.3 6.1v9.8l8.4-4.9L8.3 6.1z" fill="#ffffff"/></svg></div>
      <div class="t">直播运营<span>中心</span></div>
    </div>
    <div class="spacer"></div>
    <div class="user">
      <div class="avatar" id="topAvatar">江</div>
      <div>
        <div class="uname" id="topName">—</div>
        <span class="role-tag" id="topRole">—</span>
      </div>
      <button class="btn-logout" onclick="changeMyPwd()">修改密码</button>
      <button class="btn-logout" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="mainContent"></div>
  </div>
</div>

function sha256(str) {
  function rr(v, c) { return (v >>> c) | (v << (32 - c)); }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const utf8 = unescape(encodeURIComponent(str));
  const msg = [];
  for (let i = 0; i < utf8.length; i++) msg.push(utf8.charCodeAt(i) & 0xff);
  const bitLen = utf8.length * 8;
  msg.push(0x80);
  while (msg.length % 64 !== 56) msg.push(0);
  const hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
  for (let i = 3; i >= 0; i--) msg.push((hi >>> (8*i)) & 0xff);
  for (let i = 3; i >= 0; i--) msg.push((lo >>> (8*i)) & 0xff);
  for (let b = 0; b < msg.length; b += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (msg[b+4*i]<<24)|(msg[b+4*i+1]<<16)|(msg[b+4*i+2]<<8)|(msg[b+4*i+3]);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3);
      const s1 = rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let a=H[0],b2=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6)^rr(e,11)^rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a,2)^rr(a,13)^rr(a,22);
      const maj = (a & b2) ^ (a & c) ^ (b2 & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
    }
    H = [(H[0]+a)|0,(H[1]+b2)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x => ('00000000'+((x>>>0).toString(16))).slice(-8)).join('');
}

let session = null;
// 兜底解析店铺绑定：兼容 localStorage 旧数据（非 admin 账号缺 store 时从内置 USERS 补）
function resolveStore(user){
  if(!user) return null;
  if(user.store) return user.store;
  const builtin = USERS.find(x=>x.username===user.username || x.id===user.id || x.name===user.name);
  return (builtin && builtin.store) || null;
}
function loadSession(){
  try{ session = JSON.parse(localStorage.getItem('liveops_session')||'null'); }catch(e){ session=null; }
  if(session){
    // 从内置 USERS 同步最新角色与店铺绑定（兼容旧版本遗留的登录态）
    const builtin = USERS.find(x=>x.username===session.username || x.id===session.id || x.name===session.name);
    if(builtin){
      session.role = builtin.role;
      session.title = builtin.title;
      session.store = builtin.store || session.store;
    }
    session.store = resolveStore(session);
    // 非 admin 却无店铺绑定，视为无效登录态，强制重新登录
    if(session.role!=='admin' && !session.store){ session=null; }
  }
}
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');
  const user=getUsers().find(x=>x.username===u);
  if(!user || sha256(p)!==user.pwdHash){ err.textContent='账号或密码错误'; return; }
  session={id:user.id, username:user.username, name:user.name, role:user.role, title:user.title, store:resolveStore(user), ts:Date.now()};
  localStorage.setItem('liveops_session',JSON.stringify(session));
  enterApp();
}
function doLogout(){ localStorage.removeItem('liveops_session'); session=null; location.reload(); }
function perm(){ return PERM[session.role]||PERM.viewer; }

function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const username=document.getElementById('regUser').value.trim();
  const pwd=document.getElementById('regPwd').value;
  const pwd2=document.getElementById('regPwd2').value;
  const note=document.getElementById('regNote').value.trim();
  const err=document.getElementById('regErr');
  err.style.color='';
  if(!name){ err.textContent='请填写姓名'; return; }
  if(!username){ err.textContent='请设置登录账号'; return; }
  if(pwd.length<6){ err.textContent='密码至少 6 位'; return; }
  if(pwd!==pwd2){ err.textContent='两次密码不一致'; return; }
  const users=getUsers();
  if(users.find(x=>x.username===username)){ err.textContent='该账号已存在，请更换登录账号'; return; }
  const pending=getPending();
  if(pending.find(x=>x.username===username)){ err.textContent='该账号已提交过注册申请，正在等待审核'; return; }
  pending.push({id:'p_'+Date.now(), name:name, username:username, pwdHash:sha256(pwd), note:note||'', role:'viewer', time:new Date().toLocaleString('zh-CN')});
  savePending(pending);
  err.style.color='var(--cyan)'; err.textContent='✅ 注册申请已提交，等待总负责人审核通过后即可登录';
  ['regName','regUser','regPwd','regPwd2','regNote'].forEach(id=>document.getElementById(id).value='');
}

// ================= 工具函数 =================
const fmtWan=v=>v==null?'—':(Math.abs(v)>=10000?(v/10000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'万':Math.round(v).toLocaleString('zh-CN'));
const fmtInt=v=>v==null?'—':Math.round(v).toLocaleString('zh-CN');
const fmt2=v=>v==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
const momBadge=v=>{ if(v==null)return '<span class="mom flat">环比 —</span>'; const c=v>0?'up':(v<0?'down':'flat'); const a=v>0?'▲':(v<0?'▼':'▬'); return `<span class="mom ${c}">环比 ${a} ${Math.abs(v)}%</span>`; };

function barChart(el, series, opts){
  opts=opts||{}; const W=560,H=230,padL=56,padR=14,padT=22,padB=40;
  const labels=opts.labels||['6月','7月','8月'];
  const all=series.flatMap(s=>s.data.map(Number));
  const max=Math.max(...all.filter(x=>x>0))*1.12||1;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">`;
  for(let i=0;i<=4;i++){ const y=padT+(H-padT-padB)*i/4; const v=max*(1-i/4);
    svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eef1f6" stroke-width="1"/>`;
    svg+=`<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6b7280">${v>=10000?(v/10000).toFixed(0)+'万':Math.round(v)}</text>`; }
  const n=series.length, gw=(W-padL-padR)/labels.length;
  labels.forEach((lb,i)=>{ const cx=padL+gw*i+gw/2;
    series.forEach((s,si)=>{ const bw=gw*0.6/n; const x=cx-gw*0.3+bw*si+bw/2;
      const v=s.data[i]||0; const h=Math.max(0,(H-padT-padB)*v/max); const y=H-padB-h;
      svg+=`<rect x="${x}" y="${y}" width="${Math.max(1,bw-4)}" height="${h}" rx="4" fill="${s.color}"/>`;
      svg+=`<text x="${x+(bw-4)/2}" y="${y-6}" text-anchor="middle" font-size="10" font-weight="700" fill="${s.color}">${v>=10000?(v/10000).toFixed(0)+'万':Math.round(v)}</text>`; });
    svg+=`<text x="${cx}" y="${H-padB+18}" text-anchor="middle" font-size="12" fill="#6b7280">${lb}</text>`; });
  svg+='</svg>'; el.innerHTML=svg;
}
function lineChart(el, series, opts){
  opts=opts||{}; const W=560,H=230,padL=56,padR=14,padT=22,padB=40;
  const labels=opts.labels||['6月','7月','8月'];
  const all=series.flatMap(s=>s.data.map(Number));
  let mn=Math.min(...all.filter(x=>x>0)), mx=Math.max(...all.filter(x=>x>0));
  if(mn===mx){mn=mn*0.9; mx=mx*1.1;} const range=mx-mn; const top=mx+range*0.12, bot=mn-range*0.12;
  const Y=v=>padT+(H-padT-padB)*(1-(v-bot)/(top-bot));
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">`;
  for(let i=0;i<=4;i++){ const y=padT+(H-padT-padB)*i/4; const v=top-(top-bot)*i/4;
    svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eef1f6"/>`;
    svg+=`<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6b7280">${v>=10000?(v/10000).toFixed(0)+'万':Math.round(v)}</text>`; }
  const gw=(W-padL-padR)/labels.length;
  labels.forEach((lb,i)=>{ const cx=padL+gw*i+gw/2;
    svg+=`<text x="${cx}" y="${H-padB+18}" text-anchor="middle" font-size="12" fill="#6b7280">${lb}</text>`; });
  series.forEach(s=>{ let d=''; const pts=s.data.map((v,i)=>{ const x=padL+gw*i+gw/2; const y=Y(v); return {x,y,v}; });
    pts.forEach((p,i)=>{ if(i===0)d+=`M${p.x},${p.y}`; else d+=` L${p.x},${p.y}`; });
    svg+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ svg+=`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${s.color}"/>`;
      svg+=`<text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="10" fill="${s.color}" font-weight="700">${p.v>=10000?(p.v/10000).toFixed(1)+'万':Math.round(p.v)}</text>`; }); });
  svg+='</svg>'; el.innerHTML=svg;
}
// 大盘分位数：给定 metric + value，线性插值出百分位
function rankOf(metric, value){
  const b=DATA.benchmark[metric]; if(!b||value==null) return null;
  const ps=[5,10,25,50,75,90,95]; const vs=ps.map(p=>b['p'+p]);
  if(value<=vs[0]) return ps[0];
  if(value>=vs[6]) return 100;
  for(let i=0;i<6;i++){ if(value>=vs[i]&&value<=vs[i+1]){ const t=(value-vs[i])/(vs[i+1]-vs[i]); return ps[i]+t*(ps[i+1]-ps[i]); } }
  return 50;
}

function parseSingleStore(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return null;
  const cells=lines.map(l=>l.split('\t'));
  const header=cells[0].map(h=>h.trim());
  const map={'统计周期':'period','店铺':'store','直播场次':'sess','直播时长（秒）':'sec','直播时长(秒)':'sec','直播GMV':'gmv','店铺GMV':'store_gmv','直播业绩占比':'ratio','支付订单点击转化率（PCR）':'pcr','支付订单点击转化率(PCR)':'pcr','创建订单点击转化率（CVR）':'cvr','创建订单点击转化率(CVR)':'cvr','商品点击率（CTR）':'ctr','商品点击率(CTR)':'ctr','平均观看时长（秒）':'watch','平均观看时长(秒)':'watch','新关注量':'follow','产品曝光量':'exposure','客单价':'aov','浏览人数':'viewers','支付订单量':'orders'};
  const idx={}; header.forEach((h,i)=>{ if(map[h]) idx[map[h]]=i; });
  const toNum=x=>{ if(x==null||String(x).trim()==='')return null; const n=parseFloat(String(x).replace(/[%,，\s]/g,'')); return isNaN(n)?null:n; };
  const st=cells[1][idx['store']]||'导入店铺';
  const months={};
  for(let r=1;r<cells.length;r++){
    const get=k=>idx[k]!=null?cells[r][idx[k]]:undefined;
    if(!get('period')||!get('period').trim()) continue;
    const p=String(get('period')).trim();
    const gmv=toNum(get('gmv'))||0, sess=toNum(get('sess'))||0, sec=toNum(get('sec'))||0;
    months[p]={gmv:gmv, sess:sess, sec:sec, avg_gmv:sess?gmv/sess:0, hour_gmv:sec?gmv/(sec/3600):0,
      store_gmv:toNum(get('store_gmv'))||0, ratio:toNum(get('ratio')), pcr:toNum(get('pcr')), ctr:toNum(get('ctr')),
      watch:toNum(get('watch')), follow:toNum(get('follow'))||0, aov:toNum(get('aov')), exposure:toNum(get('exposure'))||0,
      viewers:toNum(get('viewers'))||0, orders:toNum(get('orders'))||0, cvr:toNum(get('cvr'))};
  }
  if(Object.keys(months).length===0) return null;
  return {store:String(st).trim(), country:'—', cat:'—', manager:'—', code:'—', months:months};
}

// markdown 转 HTML（用于界面上正确显示 AI 输出，避免 ** # - 等符号乱码）
function mdToHtml(md){
  if(!md) return '';
  let html = String(md);
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // 代码块
  html = html.replace(/```([\s\S]*?)```/g, (m,p)=>'<pre style="background:var(--panel2);padding:10px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.5">'+p+'</pre>');
  // 标题
  html = html.replace(/^#{1,6}\s+(.+)$/gm, (m,p)=>{
    const lvl = (m.match(/^#+/)||[''])[0].length;
    const size = lvl<=1 ? '15.5px' : (lvl<=2 ? '14.5px' : '13.5px');
    const color = lvl<=1 ? 'var(--cyan)' : 'var(--text)';
    return '<div style="font-weight:700;font-size:'+size+';color:'+color+';margin:12px 0 6px">'+p+'</div>';
  });
  // 无序列表
  html = html.replace(/^[-*]\s+(.+)$/gm, '<div style="margin:4px 0;padding-left:4px">• $1</div>');
  // 有序列表
  html = html.replace(/^(\d+)[.、]\s+(.+)$/gm, '<div style="margin:4px 0">$1. $2</div>');
  // 加粗
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12.5px">$1</code>');
  // 换行
  html = html.replace(/\n/g, '<br>');
  return html;
}
function downloadText(filename, text){
  const blob = new Blob(['\ufeff'+text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function exportConclusion(){
  if(!window._export || !window._export.md){ alert('当前页面暂无结论可导出'); return; }
  downloadText(window._export.title + '.md', window._export.md);
}
function exportConclusionHtml(){
  if(!window._export || !window._export.md){ alert('当前页面暂无结论可导出'); return; }
  let body;
  if(window._export.html){

    body = window._export.html;

      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^### (.*)$/gm,'<h3>$1</h3>')
      .replace(/^## (.*)$/gm,'<h2>$1</h2>')
      .replace(/^# (.*)$/gm,'<h1>$1</h1>')
      .replace(/^\* (.*)$/gm,'<li>$1</li>')
      .replace(/^- (.*)$/gm,'<li>$1</li>')
      .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
      .replace(/\n/g,'<br>');
  }
  const css = ':root{--border:#ececee;--panel2:#f6f6f8;--text:#262626;--muted:#737373;--orange:#ea580c;--cyan:#833ab4}body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:820px;margin:40px auto;padding:0 24px;color:#262626;line-height:1.8}h1{font-size:24px}h2{font-size:19px;border-bottom:2px solid #833ab4;padding-bottom:6px;margin-top:28px}h3{font-size:16px;color:#405de6;margin-top:20px}li{margin:4px 0}.card{background:#ffffff;border:1px solid #ececee;border-radius:12px;padding:16px;margin:14px 0}.card h4{margin:0 0 8px;font-size:15px}img{max-width:100%;height:auto}';
  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>'+window._export.title+'</title><style>'+css+'</style></head><body>'+body+'</body></html>';

function parseWeekly(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return null;
  const cells=lines.map(l=>l.split('\t')); const header=cells[0].map(h=>h.trim());
  const map={'店铺':'store','店编':'code','品类':'cat','国家':'country','店长':'manager','直播场次':'sess','直播时长（秒）':'sec','直播时长(秒)':'sec','直播GMV':'gmv','店铺GMV':'store_gmv','直播业绩占比':'ratio','支付订单点击转化率（PCR）':'pcr','支付订单点击转化率(PCR)':'pcr','平均观看时长（秒）':'watch','平均观看时长(秒)':'watch','新关注量':'follow','产品曝光量':'exposure','点击率（CTR）':'ctr','点击率(CTR)':'ctr','客单价':'aov','浏览人数':'viewers','支付订单量':'orders','上周直播GMV':'last_gmv','上周GMV':'last_gmv'};
  const idx={}; header.forEach((h,i)=>{ if(map[h]) idx[map[h]]=i; });
  if(idx.store==null && idx.gmv==null) return {error:'未识别到「店铺」或「直播GMV」列'};
  const rows=[];
  for(let r=1;r<cells.length;r++){ const get=k=>idx[k]!=null?cells[r][idx[k]]:undefined;
    const v=get('store'); if(!v||!v.trim()) continue;
    const toNum=x=>{ if(x==null||String(x).trim()==='')return null; const n=parseFloat(String(x).replace(/[%,，\s]/g,'')); return isNaN(n)?null:n; };
    rows.push({store:String(v).trim(),code:get('code'),cat:get('cat'),country:get('country'),manager:get('manager'),gmv:toNum(get('gmv'))||0,sess:toNum(get('sess'))||0,sec:toNum(get('sec'))||0,ratio:toNum(get('ratio')),pcr:toNum(get('pcr')),watch:toNum(get('watch')),follow:toNum(get('follow'))||0,exposure:toNum(get('exposure'))||0,ctr:toNum(get('ctr')),aov:toNum(get('aov')),last_gmv:toNum(get('last_gmv')),store_gmv:toNum(get('store_gmv'))||0}); }
  return {rows};
}
function calcWeekly(rows){
  const keys=['gmv','avg_gmv','ratio','pcr','watch','ctr','follow'];
  rows.forEach(r=>{ r.avg_gmv=r.sess?r.gmv/r.sess:0; r.hour_gmv=r.sec?r.gmv/(r.sec/3600):0; if(r.ratio!=null) r.ratio=Math.min(r.ratio,100); });
  const sorted={}; keys.forEach(k=>{ sorted[k]=rows.map(r=>r[k]).filter(v=>v!=null).sort((a,b)=>a-b); });
  const rank=(sorted,v)=>{ if(v==null||!sorted.length)return null; let lo=0,hi=sorted.length; while(lo<hi){const m=(lo+hi)>>1; if(sorted[m]<v)lo=m+1;else hi=m;} return (lo-1)/(sorted.length-1)*100; };
  const W={gmv:20,avg_gmv:20,ratio:10,pcr:15,watch:15,ctr:10,follow:10};
  rows.forEach(r=>{ let s=0,w=0; keys.forEach(k=>{const p=rank(sorted[k],r[k]); if(p!=null){s+=p*W[k];w+=W[k];}}); r.score=w?Math.round(s/w*10)/10:null; r.mom=(r.last_gmv!=null&&r.last_gmv>0)?Math.round((r.gmv-r.last_gmv)/r.last_gmv*1000)/10:null; });
  const bkKeys=['exposure','ctr','pcr','watch','follow','aov','sess'];
  const bkSorted={}; bkKeys.forEach(k=>{ bkSorted[k]=rows.map(r=>r[k]).filter(v=>v!=null).sort((a,b)=>a-b); });
  rows.forEach(r=>{ const cand=[]; bkKeys.forEach(k=>{ const p=rank(bkSorted[k],r[k]); if(p!=null)cand.push([k,p]); }); cand.sort((a,b)=>a[1]-b[1]); r.bottlenecks=cand.slice(0,3).map(([k,p])=>({key:k,name:BOTTLENECK[k].name,fixes:BOTTLENECK[k].fixes.map(f=>f.a)})); });
  const scored=rows.filter(r=>r.score!=null).sort((a,b)=>b.score-a.score); const n=scored.length;
  scored.forEach((r,i)=>{ r.rank=i+1; r.cls=r.score>=75?'标杆':(r.score<=25?'问题':(r.score<=40?'观察':'正常')); });
}

// 内置默认 DeepSeek Key（所有账号默认可用；总负责人可在配置页覆盖）
const DEFAULT_DS_KEY = 'sk-41c5f526a7224b8dab5e14adfcfeca6f';
function proxyUrl(){ return (localStorage.getItem('liveops_proxy_url')||'').trim(); }
function proxyToken(){ return localStorage.getItem('liveops_proxy_token')||''; }
function directKey(){ return localStorage.getItem('liveops_ds_key') || DEFAULT_DS_KEY; }
function setProxyUrl(v){ if(v) localStorage.setItem('liveops_proxy_url',v.trim()); else localStorage.removeItem('liveops_proxy_url'); }
function setProxyToken(v){ if(v) localStorage.setItem('liveops_proxy_token',v); else localStorage.removeItem('liveops_proxy_token'); }
function setDirectKey(v){ if(v) localStorage.setItem('liveops_ds_key',v.replace(/[^\x00-\xFF]/g,'').trim()); else localStorage.removeItem('liveops_ds_key'); }
function aiConfigured(){ return !!(proxyUrl() || directKey()); }

async function callDeepSeek(prompt, maxTokens){
  maxTokens = maxTokens || 2500;
  const messages = [{role:'system',content:DS_SYSTEM},{role:'user',content:prompt}];
  const pUrl = proxyUrl();
  // ---- 模式1：服务端代理（推荐，Key 不暴露）----
  if(pUrl){
    try{
      const headers = {'Content-Type':'application/json; charset=utf-8'};
      const t = proxyToken();
      if(t) headers['X-Auth-Token'] = t;
      const res = await fetch(pUrl.replace(/\/+$/,'') + '/chat', {
        method:'POST', headers,
        body: JSON.stringify({messages, temperature:0.7, max_tokens:maxTokens})
      });
      const j = await res.json();
      if(j.error) return {err:(j.error.message||'代理返回错误') + (res.status?` (HTTP ${res.status})`:'')};
      return {text:j.choices?.[0]?.message?.content||'(空响应)'};
    }catch(e){ return {err:'代理调用失败：'+String(e)}; }
  }
  // ---- 模式2：直连（兜底，Key 仅存本机，不推荐长期使用）----
  let key = directKey().replace(/[^\x00-\xFF]/g,'').trim();
  if(!key) return {err:'请先在「DeepSeek 大模型配置」里填写代理地址，或临时填写直连 Key'};
  if(!/^sk-[A-Za-z0-9]{20,}$/.test(key)) return {err:'直连 Key 格式异常，请检查是否含隐藏字符'};
  try{
    const res=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json; charset=utf-8','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.7,max_tokens:maxTokens})});
    const j=await res.json();
    if(j.error) return {err:(j.error.message||'API错误') + (j.error.code?` (code: ${j.error.code})`:'')};
    return {text:j.choices?.[0]?.message?.content||'(空响应)'};
  }catch(e){ return {err:String(e)}; }
}

// ===== DeepSeek 视觉模型（直播间场景图片识别）=====
async function callDeepSeekVision(prompt, imageBase64){
  let key = directKey().replace(/[^\x00-\xFF]/g,'').trim();
  if(!key) return {err:'未配置 DeepSeek API Key'};
  if(!/^sk-[A-Za-z0-9]{20,}$/.test(key)) return {err:'直连 Key 格式异常，请检查是否含隐藏字符'};
  const doCall = async (detail)=>{
    const messages = [
      {role:'system', content:DS_SYSTEM},
      {role:'user', content:[
        {type:'text', text:prompt},
        {type:'image_url', image_url:{url:imageBase64, detail:detail}}
      ]}
    ];
    const bodyStr=JSON.stringify({model:'deepseek-v4-flash-vision-exp',messages,temperature:0.7,max_tokens:6000});
    if(bodyStr.length > 8*1024*1024) return {err:'请求体超过 8MB（图片或提示词过大）。请换张更小的图片，或先压缩到 1MB 以内再上传。'};
    try{
      const res=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',
        headers:{'Content-Type':'application/json; charset=utf-8','Authorization':'Bearer '+key},
        body:bodyStr});
      const j=await res.json();
      if(j.error) return {err:(j.error.message||'API错误') + (j.error.code?` (code: ${j.error.code})`:'') + ` (HTTP ${res.status})`};
      const choice=j.choices && j.choices[0];
      if(!choice){ return {err:`API 未返回 choices（HTTP ${res.status}），原始响应：`+JSON.stringify(j).slice(0,200)}; }
      if(choice.message && choice.message.content) return {text:choice.message.content};
      return {empty:true, reason:choice.finish_reason||'unknown', size:Math.round(bodyStr.length/1024)};
    }catch(e){ return {err:'调用失败：'+String(e)}; }
  };
  let r1=await doCall('low');
  if(r1.text) return r1;
  if(r1.err) return r1;
  // 空内容 → 换 detail=high 重试一次（实验版模型偶发波动）
  let r2=await doCall('high');
  if(r2.text) return r2;
  if(r2.err) return r2;
  let errMsg = '视觉模型两次均返回空内容 (finish_reason=' + (r2.reason||'unknown') + ')。\n';
  if(r2.reason==='length'){
    errMsg += '⚠️ 原因：模型输出达到 max_tokens 上限被截断（已提到 3000 tokens）。\n';
    errMsg += '建议：① 这张图内容确实很丰富，分析需要超过 3000 tokens（可再上调） ② 把图片压缩得更小、聚焦关键区域后重试。\n';
  } else {
    errMsg += '可能原因：① 图片内容无法被识别（换张更清晰的 JPG 重试） ② 实验版模型波动（稍后重试） ③ 图片含特殊内容。\n';
  }
  errMsg += 'body 约 ' + r2.size + 'KB。';
  return {err:errMsg};
}

// 图片压缩为 base64 data URL（控制体积，适配视觉模型内联输入；多层兜底，绝不返回空/损坏 base64）
function compressImage(file, maxW, quality){
  maxW = maxW || 1024; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const rawDataUrl = e.target.result; // 原始 data URL，作为最终保底
      if(!rawDataUrl){ reject(new Error('文件读取结果为空')); return; }
      // 原始图片已较小（<400KB base64），直接传原始，避免 canvas 处理风险
      if(rawDataUrl.length < 400*1024){ resolve(rawDataUrl); return; }
      // 大图才走 canvas 压缩
      const img = new Image();
      img.onload = ()=>{
        try{
          const w=img.width, h=img.height;
          if(!w || !h){ resolve(rawDataUrl); return; }
          const scale=Math.min(1, maxW/w);
          const cw=Math.max(1, Math.round(w*scale)), ch=Math.max(1, Math.round(h*scale));
          const canvas=document.createElement('canvas');
          canvas.width=cw; canvas.height=ch;
          const ctx=canvas.getContext('2d');
          if(!ctx){ resolve(rawDataUrl); return; }
          ctx.drawImage(img,0,0,cw,ch);
          // 关键：检查 toDataURL 结果，空/损坏则回退原始
          let out='';
          try{ out=canvas.toDataURL('image/jpeg', quality); }catch(e2){ out=''; }
          if(out && out.length > 100){ resolve(out); }
          else{ resolve(rawDataUrl); } // canvas 结果异常 → 回退原始图
        }catch(err){ resolve(rawDataUrl); } // 任何异常 → 回退原始图
      };
      img.onerror=()=>resolve(rawDataUrl); // 图片加载失败 → 回退原始
      img.src=rawDataUrl;
    };
    reader.onerror=()=>reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

// ===== 场景诊断报告渲染（原图标注 + 草图 + 文字）=====
function renderSceneReport(base64, text, sizeInfo){
  let marks=[], sketch=null;
  let cleanText=text, jsonBlock=null;
  // 遍历所有 ``` 代码块，找能 JSON.parse 出 marks/sketch 的那个（AI 可能在文字里画漏斗图等其它代码块）
  const blocks=text.match(/```[\s\S]*?```/g)||[];
  for(const block of blocks){
    const inner=block.replace(/^```(?:json|JSON)?\s*/,'').replace(/```\s*$/,'');
    try{
      const obj=JSON.parse(inner.trim());
      if(obj && (obj.marks || obj.sketch)){
        if(obj.marks && obj.marks.length) marks=obj.marks;
        if(obj.sketch) sketch=obj.sketch;
        jsonBlock=block;
        break;
      }
    }catch(e){}
  }
  // 兜底：全文提取含 marks 的对象（无代码块标记时）
  if(!jsonBlock){
    const m2=text.match(/\{\s*"marks"\s*:\s*\[[\s\S]*?\]\s*(?:,\s*"sketch"\s*:\s*\{[\s\S]*?\})?\s*\}/);
    if(m2){
      try{ const obj=JSON.parse(m2[0]); if(obj.marks && obj.marks.length) marks=obj.marks; if(obj.sketch) sketch=obj.sketch; jsonBlock=m2[0]; }catch(e){}
    }
  }
  if(jsonBlock){ cleanText=text.replace(jsonBlock,'').trim(); }
  // 导出按钮
  const exportBtns=`<div style="display:flex;gap:8px;margin:4px 0 10px"><button class="btn" style="padding:6px 12px" onclick="exportConclusion()">📥 导出结论</button><button class="btn ghost" style="padding:6px 12px" onclick="exportConclusionHtml()">导出报告(HTML)</button></div>`;
  // 原图 + 标注框
  let imgHtml='';
  if(base64){
    imgHtml=`<div style="position:relative;margin:12px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--panel2)">
      <img src="${base64}" style="width:100%;display:block">
      ${marks.map(m=>{
        const c=['#ff5a7d','#a78bfa','#6366f1','#10b981','#f59e0b','#06b6d4'][((m.n||1)-1)%6];
        const x=m.x!=null?m.x:0, y=m.y!=null?m.y:0, w=(m.w!=null?m.w:18), h=(m.h!=null?m.h:14);
        return `<div style="position:absolute;left:${Math.max(0,Math.min(100,x))}%;top:${Math.max(0,Math.min(100,y))}%;width:${Math.max(5,Math.min(100,w))}%;height:${Math.max(4,Math.min(100,h))}%;border:2px solid ${c};background:${c}33;border-radius:6px;box-sizing:border-box" title="${(m.issue||'')}">
          <span style="position:absolute;left:-2px;top:-14px;background:${c};color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap">${m.n||''} ${m.label||''}</span>
        </div>`;
      }).join('')}
    </div>`;
  }
  // 标注明细
  let legendHtml='';
  if(marks.length){
    legendHtml=`<div class="card" style="margin-top:10px"><h4>📍 图上标注明细</h4><ul style="margin:8px 0 0 18px;line-height:1.8">${marks.map(m=>`<li><b style="color:#ff5a7d">${m.n||''}. ${m.label||'区域'}</b>：<span style="color:var(--orange)">${m.issue||''}</span> → ${m.fix||''}</li>`).join('')}</ul></div>`;
  }
  // 优化草图
  let sketchHtml='';
  if(sketch && sketch.zones && sketch.zones.length){
    sketchHtml=renderSketchSVG(sketch);
  }
  // 文字诊断（markdown 渲染，避免 ** # 等乱码）
  const textHtml = cleanText ? `<div class="card" style="margin-top:10px"><h4>📋 详细文字诊断</h4><div style="line-height:1.8;font-size:14px">${mdToHtml(cleanText)}</div></div>` : '';
  const contentHtml = imgHtml + legendHtml + sketchHtml + textHtml;
  return {
    display: `<div style="margin-top:10px">${exportBtns}${contentHtml}<div style="margin-top:8px">${sizeInfo}</div></div>`,
    content: contentHtml
  };
}

function getActions(){ try{ const a=JSON.parse(localStorage.getItem('liveops_actions')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }

function storeOwnerUsername(store){ const u=USERS.find(x=>x.role==='store' && x.store===store); return u?u.username:''; }
// —— 从 AI 文本宽容解析行动项 ——
function parseActionsFromText(text){
  if(!text) return [];
  // 遍历所有 ``` 代码块，找能 JSON.parse 出 actions 的那个（AI 可能在文字里画漏斗图等其它代码块）
  const blocks=text.match(/```[\s\S]*?```/g)||[];
  for(const block of blocks){
    const inner=block.replace(/^```(?:json|JSON)?\s*/,'').replace(/```\s*$/,'');
    try{
      const obj=JSON.parse(inner.trim());
      if(obj && Array.isArray(obj.actions)) return obj.actions.filter(a=>a && (a.title||a.action));
    }catch(e){}
  }
  // 兜底：全文提取 {"actions":[...]} 对象
  const m=text.match(/\{\s*"actions"\s*:\s*\[[\s\S]*?\]\s*\}/);
  if(m){ try{ const obj=JSON.parse(m[0]); if(obj && Array.isArray(obj.actions)) return obj.actions.filter(a=>a && (a.title||a.action)); }catch(e){} }
  return [];
}
// —— 行动项落库（诊断后调用）——
function commitActions(store, rawActions, source){
  if(!Array.isArray(rawActions)||!rawActions.length) return 0;
  const now=Date.now(); const all=getActions(); let added=0;
  rawActions.forEach((a,i)=>{
    const act={
      id:'a_'+now+'_'+i, store:store||'', owner:storeOwnerUsername(store)||'',
      title:a.title||a.action||'未命名行动项', detail:a.detail||a.fix||'',
      priority:String(a.priority||a.level||'P1').toUpperCase().replace(/[^P0-9]/g,'').slice(0,2)||'P1',
      expected:a.expected||a.metric||'', due:a.due||a.deadline||'',
      status:'pending', source:source||'AI诊断', created:new Date().toLocaleString('zh-CN'), createdTs:now
    };
    all.unshift(act); added++;
  });
  saveActions(all); return added;
}
// —— 问题申诉（店长对诊断/行动项发起申诉，总负责人审批）——
const APPEAL_REASONS=['新品/换季空窗期','大促前后蓄水或透支','店铺/仓库搬迁、物流异常','平台活动或政策变化','主播/团队人员变动','库存/断货','数据口径或统计异常','其他（请补充说明）'];
function appealAction(id){
  const all=getActions(); const a=all.find(x=>x.id===id);
  if(!a) return;
  if(a.status==='appeal'){ alert('该行动项已在申诉中，请等待总负责人处理'); return; }
  const menu=APPEAL_REASONS.map((r,i)=>(i+1)+'. '+r).join('\n');
  const choice=prompt('请选择申诉原因（输入编号）：\n\n'+menu);
  if(!choice) return;
  const idx=parseInt(choice,10)-1;
  if(isNaN(idx)||idx<0||idx>=APPEAL_REASONS.length){ alert('编号无效'); return; }
  const note=prompt('补充说明（可选，说明特殊情况对数据的影响，便于总负责人判断）：')||'';
  a.status='appeal';
  a.appeal={reason:APPEAL_REASONS[idx], note:note, submittedAt:new Date().toLocaleString('zh-CN')};
  a.appealResult='pending';
  saveActions(all);
  commitHistory(a.store, '店长申诉', {note:'对行动项「'+a.title+'」发起申诉（'+APPEAL_REASONS[idx]+'）', actionIds:[a.id], appealResult:'pending'});
  viewActions();
}
function reviewAppeal(id, result){
  const all=getActions(); const a=all.find(x=>x.id===id);
  if(!a) return;
  if(result==='approved'){
    const reply=prompt('通过申诉。可填写处理意见（可选）：')||'';
    a.appealResult='approved'; a.appealReply=reply;
    a.status='done'; a.doneAt=new Date().toLocaleString('zh-CN');
  } else {
    const reply=prompt('驳回申诉。请填写驳回原因（建议填写，店长可见）：')||'';
    a.appealResult='rejected'; a.appealReply=reply;
    a.status='pending';
  }
  a.appealReviewedAt=new Date().toLocaleString('zh-CN');
  saveActions(all);
  commitHistory(a.store, '申诉审批', {note:'申诉「'+a.title+'」已'+(result==='approved'?'通过':'驳回')+(a.appealReply?('（'+(result==='approved'?'处理意见':'驳回原因')+'：'+a.appealReply+'）'):''), actionIds:[a.id], appealResult:result});
  viewActions();
}
// —— 钉钉推送（保留备用；当前改用站内待办，不推钉钉）——
async function dingPush(title, text){
  const cfg=getDingCfg();
  if(!cfg.webhook || !cfg.webhook.trim()) return {err:'未配置钉钉机器人 webhook 地址（请在下方「钉钉推送配置」填写）'};
  const pUrl=proxyUrl();
  if(!pUrl) return {err:'钉钉推送需要先部署代理（AI 知识库 → 代理地址），因为钉钉 webhook 不支持浏览器直连 CORS。详见「服务端代理/部署指南.md」'};
  const payload={msgtype:'markdown', markdown:{title:title, text:text}};
  try{
    const headers={'Content-Type':'application/json; charset=utf-8'};
    const t=proxyToken(); if(t) headers['X-Auth-Token']=t;
    const res=await fetch(pUrl.replace(/\/+$/,'')+'/dingtalk',{
      method:'POST', headers,
      body: JSON.stringify({webhook: cfg.webhook.trim(), secret: (cfg.secret||'').trim(), payload})
    });
    const j=await res.json().catch(()=>({}));
    if(j.errcode && j.errcode!==0){
      if(j.errcode===310000) return {err:'机器人已开启「加签」安全设置，请检查加签密钥（SEC 开头）是否正确'};
      return {err:'钉钉返回错误：'+(j.errmsg||('errcode '+j.errcode))};
    }
    return {ok:true};
  }catch(e){ return {err:'推送失败：'+String(e)+'（请确认代理已部署 /chat 和 /dingtalk 端点）'}; }
}

function numX(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='string'){ v=v.trim().replace(/%/g,'').replace(/,/g,''); if(v===''||v==='-'||v==='--'||v==='N/A'||v==='n/a') return null; }
  const n=parseFloat(v); return isNaN(n)?null:n;
}

    const gmv=numX(g(r,'gmv'))||0, sess=numX(g(r,'sess'))||0, sec=numX(g(r,'sec'))||0;
    const d={period:String(g(r,'period')||'').trim(),code:String(g(r,'code')||'').trim(),store:storeName,cat:String(g(r,'cat')||'').trim(),country:String(g(r,'country')||'').trim(),manager:String(g(r,'manager')||'').trim(),base:String(g(r,'base')||'').trim(),gmv:gmv,sess:sess,sec:sec,store_gmv:numX(g(r,'storeGmv'))||0,pcr:numX(g(r,'pcr')),ctr:numX(g(r,'ctr')),ratio:numX(g(r,'ratio')),watch:numX(g(r,'watch')),follow:numX(g(r,'follow'))||0,exposure:numX(g(r,'exposure'))||0,viewers:numX(g(r,'viewers'))||0,aov:numX(g(r,'aov')),orders:numX(g(r,'orders'))||0,cvr:numX(g(r,'cvr'))};

  const byStore={}; recs.forEach(d=>{ (byStore[d.store]=byStore[d.store]||{})[d.period]=d; });

  const latest=recs.filter(d=>d.period===latestPeriod);

  const NAME_MAP={gmv:'直播GMV',avg_gmv:'场均GMV',ratio_cap:'直播业绩占比',pcr:'支付转化率PCR',watch:'平均观看时长',ctr:'商品点击率CTR',follow:'新关注量'};

  const findLatest=st=>latest.find(x=>x.store===st);
  const makeEntry=(st,typ)=>{ const d=findLatest(st); const e={store:st,code:d.code,country:d.country,cat:d.cat,manager:d.manager,score:d.score,gmv:Math.round(d.gmv),avg_gmv:Math.round(d.avg_gmv),ratio:d.ratio_cap!=null?Math.round(d.ratio_cap*10)/10:null,pcr:d.pcr!=null?Math.round(d.pcr*10)/10:null,ctr:d.ctr!=null?Math.round(d.ctr*10)/10:null,watch:d.watch!=null?Math.round(d.watch):null,follow:Math.round(d.follow||0),aov:d.aov!=null?Math.round(d.aov):null,sess:Math.round(d.sess||0),gmv_mom:d.gmv_mom,score_mom:d.score_mom,trend_score:trend3(st),trend_gmv:gmv3(st),type:typ}; return e; };

// ================= 视图10：诊断留痕（历史时间线） =================
function getHistory(){ try{ const a=JSON.parse(localStorage.getItem('liveops_history')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveHistory(a){ localStorage.setItem('liveops_history', JSON.stringify(a)); }
// 取某店最新期指标快照
function snapshotOf(store){
  const s=DATA.store_series[store]; if(!s) return null;
  const periods=Object.keys(s.months||{}).sort();
  if(!periods.length) return null;
  return {period:periods[periods.length-1], cur:s.months[periods[periods.length-1]], prev:periods.length>1?s.months[periods[periods.length-2]]:null};
}
// 判断某店分档（标杆/问题/观察/正常）
function bandOf(store){
  const c=DATA.classification||{};
  if(c.bench && c.bench.some(x=>x.store===store)) return '标杆';
  if(c.problem && c.problem.some(x=>x.store===store)) return '问题';
  if(c.watch && c.watch.some(x=>x.store===store)) return '观察';
  return '正常';
}
// 留痕（同一 store+period+source 5 分钟内去重）
function commitHistory(store, source, opts){
  opts=opts||{};
  const snap=snapshotOf(store); if(!snap||!snap.cur) return 0;
  const cur=snap.cur;
  const all=getHistory();
  const dup=all.find(h=>h.store===store && h.period===snap.period && h.source===source && Date.now()-h.ts<1000*60*5);
  if(dup){
    if(opts.actionIds) dup.actionIds=[...new Set((dup.actionIds||[]).concat(opts.actionIds))];
    if(opts.note) dup.note=opts.note;
    if(opts.appealResult) dup.appealResult=opts.appealResult;
    saveHistory(all); return 0;
  }
  const rec={
    id:'h_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    store:store, period:snap.period, ts:Date.now(), time:new Date().toLocaleString('zh-CN'),
    score:cur.score!=null?cur.score:null, band:bandOf(store),
    metrics:{gmv:Math.round(cur.gmv||0),avg_gmv:Math.round(cur.avg_gmv||0),pcr:cur.pcr!=null?Math.round(cur.pcr*10)/10:null,ctr:cur.ctr!=null?Math.round(cur.ctr*10)/10:null,watch:cur.watch!=null?Math.round(cur.watch):null,follow:Math.round(cur.follow||0),aov:cur.aov!=null?Math.round(cur.aov):null,ratio:cur.ratio!=null?Math.round(cur.ratio*10)/10:null,sess:Math.round(cur.sess||0)},
    source:source, note:opts.note||'', actionIds:opts.actionIds||[], appealResult:opts.appealResult||''
  };
  all.unshift(rec);
  if(all.length>2000) all.length=2000;
  saveHistory(all); return 1;
}
// 计算某店连续垫底/上升趋势（基于已有留痕 + 当月数据）
function storeTrend(store){
  const snap=snapshotOf(store); const s=DATA.store_series[store];
  const periods=Object.keys(s.months||{}).sort();
  const scores=periods.map(p=>s.months[p].score).filter(v=>v!=null);
  const up3=scores.length>=3 && scores[scores.length-1]>scores[scores.length-2] && scores[scores.length-2]>scores[scores.length-3];

  const low3=scores.length>=3 && scores.slice(-3).every(v=>v<=40);
  return {up3, down3, low3, scores};
}

function parseSessions(rows){
  const header=rows[0]||[];
  const col=name=>{ const i=header.findIndex(h=>h!=null && String(h).trim().includes(name)); return i<0?null:i; };
  const ci={store:col('店铺'),code:col('店编'),cat:col('品类'),country:col('国家'),manager:col('店长'),base:col('基地'),date:col('直播日期'),start:col('开播时间'),sec:col('直播时长'),viewers:col('观看人数'),watch:col('平均观看时长'),follow:col('新关注'),exposure:col('曝光'),clicks:col('点击量'),ctr:col('CTR'),orders:col('订单'),cvr:col('CVR'),pcr:col('PCR'),gmv:col('GMV'),aov:col('客单价')};
  if(ci.store==null || ci.gmv==null) return {err:'未识别到「店铺」或「直播GMV」列，请确认表头含这两列。'};
  const g=(r,k)=>{ const i=ci[k]; return i==null?null:r[i]; };
  const toNum=x=>{ if(x==null||String(x).trim()==='')return null; const n=parseFloat(String(x).replace(/[%,，\s]/g,'')); return isNaN(n)?null:n; };
  const list=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const store=String(g(r,'store')||'').trim(); if(!store) continue;
    list.push({id:'s_'+i+'_'+Math.random().toString(36).slice(2,6), store:store, code:String(g(r,'code')||'').trim(), cat:String(g(r,'cat')||'').trim(), country:String(g(r,'country')||'').trim(), manager:String(g(r,'manager')||'').trim(), base:String(g(r,'base')||'').trim(), date:String(g(r,'date')||'').trim(), start:String(g(r,'start')||'').trim(), sec:toNum(g(r,'sec'))||0, viewers:toNum(g(r,'viewers'))||0, watch:toNum(g(r,'watch')), follow:toNum(g(r,'follow'))||0, exposure:toNum(g(r,'exposure'))||0, clicks:toNum(g(r,'clicks'))||0, ctr:toNum(g(r,'ctr')), orders:toNum(g(r,'orders'))||0, cvr:toNum(g(r,'cvr')), pcr:toNum(g(r,'pcr')), gmv:toNum(g(r,'gmv'))||0, aov:toNum(g(r,'aov'))});
  }
  if(!list.length) return {err:'未解析到有效场次数据行。'};
  return {list};
}

  // 指标对比表
  const bmMap={gmv:'gmv',avg_gmv:'avg_gmv',ratio:'ratio',pcr:'pcr',ctr:'ctr',watch:'watch',follow:'follow',aov:'aov',exposure:'exposure',viewers:'viewers',orders:'orders',cvr:'cvr',sess:'sess'};
  const p50=k=>{ const m=bmMap[k]; return (bm[m]&&bm[m].p50!=null)?bm[m].p50:null; };
  const cmp=(k,cur,prev)=>{
    const label=METRIC_LABEL[k]||k; const cv=cur[k]!=null?cur[k]:null; const pv=prev&&prev[k]!=null?prev[k]:null; const med=p50(k);
    const fmt=v=>v==null?'—':(k==='gmv'||k==='avg_gmv'||k==='store_gmv'||k==='aov'||k==='exposure'||k==='viewers'||k==='orders'?fmtWan(v):(k==='ratio'||k==='pcr'||k==='ctr'||k==='cvr'?v+'%':(k==='watch'?v+'秒':(k==='sess'?Math.round(v):v))));
    const mom=(cv!=null&&pv!=null&&pv!==0)?Math.round((cv-pv)/pv*1000)/10:null;
    const vsMed=(cv!=null&&med!=null&&med!==0)?Math.round((cv-med)/med*1000)/10:null;
    return `<tr><td>${label}</td><td><b>${fmt(cv)}</b></td><td>${fmt(pv)}</td><td>${fmt(med)}</td><td style="color:${mom==null?'var(--dim)':(mom>=0?'var(--green)':'var(--red)')}">${mom==null?'—':(mom>0?'+':'')+mom+'%'}</td><td style="color:${vsMed==null?'var(--dim)':(vsMed>=0?'var(--green)':'var(--red)')}">${vsMed==null?'—':(vsMed>0?'+':'')+vsMed+'%'}</td></tr>`;
  };
  const rows=['gmv','avg_gmv','store_gmv','ratio','pcr','ctr','watch','follow','aov','exposure','orders','sess'].map(k=>cmp(k,cur,prev)).join('');
  // 历史趋势折线（score + gmv）
  const periods=Object.keys(s.months||{}).sort();
  const scores=periods.map(p=>s.months[p].score);
  const gmvs=periods.map(p=>Math.round(s.months[p].gmv||0));
  const trendSVG=(()=>{
    if(periods.length<2) return '<div class="hint">仅 1 期数据，暂无可展示趋势</div>';
    const W=560,H=180,padL=40,padR=16,padT=16,padB=28;
    const minS=Math.min(...scores.filter(v=>v!=null)),maxS=Math.max(...scores.filter(v=>v!=null));
    const rngS=(maxS-minS)||1;
    const maxG=Math.max(...gmvs)||1;
    const x=i=>padL+(W-padL-padR)*(periods.length>1?i/(periods.length-1):0);
    const yS=v=>padT+(H-padT-padB)*(1-(v-minS)/rngS);
    const yG=v=>padT+(H-padT-padB)*(1-v/maxG);
    let ptsS=scores.map((v,i)=>v==null?'':`${x(i)},${yS(v)}`).filter(Boolean).join(' ');
    let ptsG=gmvs.map((v,i)=>`${x(i)},${yG(v)}`).join(' ');
    let grid=''; for(let i=0;i<=4;i++){ const yy=padT+(H-padT-padB)*i/4; grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#eef1f6" stroke-width="1"/>`; }
    let labels=periods.map((p,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7280">${p.slice(5)}月</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;border-radius:8px;border:1px solid var(--border)">
      ${grid}
      <polyline points="${ptsS}" fill="none" stroke="#6366f1" stroke-width="2.5"/>
      <polyline points="${ptsG}" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
      ${scores.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${yS(v)}" r="3" fill="#6366f1"/>`).join('')}
      ${labels}
      <text x="10" y="14" font-size="10" fill="#6366f1">— 健康度分</text>
      <text x="80" y="14" font-size="10" fill="#10b981">-- 直播GMV</text>
    </svg>`;
  })();
  // 漏斗卡点
  const bmMed={pcr:bm.pcr?bm.pcr.p50:null,ctr:bm.ctr?bm.ctr.p50:null,watch:bm.watch?bm.watch.p50:null,follow:bm.follow?bm.follow.p50:null};
  const funnel=[
    {k:'曝光',v:cur.exposure,med:bm.exposure?bm.exposure.p50:null},
    {k:'CTR',v:cur.ctr,med:bmMed.ctr,unit:'%'},
    {k:'PCR',v:cur.pcr,med:bmMed.pcr,unit:'%'},
    {k:'观看时长',v:cur.watch,med:bmMed.watch,unit:'秒'},
    {k:'新关注',v:cur.follow,med:bmMed.follow},
    {k:'GMV',v:cur.gmv,med:bm.gmv?bm.gmv.p50:null},
  ];
  const funnelHtml=funnel.map((f,i)=>{
    const below=f.med!=null&&f.v!=null&&f.v<f.med;
    const color=below?'var(--red)':'var(--green)';
    const fmt=f.unit==='%'?(v=>v==null?'—':v+'%'):(f.k==='GMV'||f.k==='曝光'?fmtWan:(v=>v==null?'—':(f.unit?v+f.unit:Math.round(v))));
    return `<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px"><span>${f.k}</span><span style="color:${color}">${fmt(f.v)} ${f.med!=null?('（达标线 '+fmt(f.med)+'）'):''}</span></div><div style="height:8px;background:var(--panel2);border-radius:4px"><div style="height:8px;width:${f.med?Math.min(100,Math.round(f.v/f.med*100)):50}%;background:${color};border-radius:4px"></div></div></div>`;
  }).join('');
  // Top3 问题定位（用瓶颈 KB）
  const bmPct={pcr:bm.pcr?bm.pcr.p25:null,ctr:bm.ctr?bm.ctr.p25:null,watch:bm.watch?bm.watch.p25:null};
  const issues=[];
  if(cur.pcr!=null&&bmPct.pcr!=null&&cur.pcr<bmPct.pcr) issues.push({k:'pcr',name:'转化率 PCR 偏低'});
  if(cur.ctr!=null&&bmPct.ctr!=null&&cur.ctr<bmPct.ctr) issues.push({k:'ctr',name:'商品点击率 CTR 偏低'});
  if(cur.watch!=null&&bmPct.watch!=null&&cur.watch<bmPct.watch) issues.push({k:'watch',name:'观看时长偏低（留人弱）'});
  if(cur.follow!=null&&bm.follow&&bm.follow.p25!=null&&cur.follow<bm.follow.p25) issues.push({k:'follow',name:'新关注偏低（涨粉弱）'});
  if(cur.aov!=null&&bm.aov&&bm.aov.p25!=null&&cur.aov<bm.aov.p25) issues.push({k:'aov',name:'客单价偏低'});
  if(cur.sess!=null&&bm.sess&&bm.sess.p25!=null&&cur.sess<bm.sess.p25) issues.push({k:'sess',name:'直播投入（场次）不足'});
  if(cur.exposure!=null&&bm.exposure&&bm.exposure.p25!=null&&cur.exposure<bm.exposure.p25) issues.push({k:'exposure',name:'曝光不足'});
  const top3=issues.slice(0,3);
  const issuesHtml=top3.length?top3.map((it,i)=>{ const b=BOTTLENECKS_KB[it.k]; return `<div class="kb-card" style="margin-bottom:8px"><b>${i+1}. ${it.name}</b><div class="hint" style="margin:4px 0">${b?b.issue:''}</div>${b?`<ul style="margin:4px 0 0 18px;font-size:13px">${b.fixes.slice(0,3).map(f=>`<li>${f}</li>`).join('')}</ul>`:''}</div>`; }).join(''):'<div class="hint">当前未发现明显短板指标（均不低于 P25）。</div>';
  // 行动项完成情况
  const actHtml=acts.length?acts.map(a=>{
    const stTxt={pending:'待办',doing:'进行中',done:'已完成',appeal:'申诉中'}[a.status]||a.status;
    return `<div style="font-size:13px;margin:4px 0">[${a.priority||'P1'}] ${a.title} — <span style="color:${a.status==='done'?'var(--green)':(a.status==='appeal'?'var(--red)':'var(--orange)')}">${stTxt}</span>${a.expected?'（预期 '+a.expected+'）':''}</div>`;
  }).join(''):'<div class="hint">本期暂无行动项。</div>';
  // 申诉记录
  const appealHtml=acts.filter(a=>a.appeal).map(a=>`<div style="font-size:13px;margin:4px 0">📢 ${a.title}：${a.appeal.reason} → <span style="color:${a.appealResult==='approved'?'var(--green)':(a.appealResult==='rejected'?'var(--dim)':'var(--red)')}">${a.appealResult==='approved'?'通过':(a.appealResult==='rejected'?'驳回':'待处理')}</span>${a.appealReply?('（'+(a.appealResult==='approved'?'处理意见':'驳回原因')+'：'+a.appealReply+'）'):''}</div>`).join('')||'<div class="hint">本期无申诉。</div>';
  const bandCls={ '标杆':'b-green','正常':'b-dim','观察':'b-amber','问题':'b-red' };
  return `
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot"></span>① 本期概览</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="badge ${bandCls[band]||'b-dim'}" style="font-size:14px">${band}</span>
      <b style="font-size:18px">${store}</b>
      <span class="hint">${s.cat||'—'} · ${s.country||'—'} · ${s.manager||'—'}</span>
      <span class="hint">周期 ${period}</span>
    </div>
    ${cur.score!=null?`<div style="font-size:13px;margin-top:8px">健康度 <b style="font-size:16px;color:${cur.score>=75?'var(--green)':(cur.score<=40?'var(--red)':'var(--cyan)')}">${cur.score}</b> 分 ${prev&&prev.score!=null?`· 环比 <span style="color:${cur.score-prev.score>=0?'var(--green)':'var(--red)'}">${cur.score-prev.score>=0?'+':''}${Math.round((cur.score-prev.score)*10)/10}</span> 分`:''}</div>`:''}
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot"></span>② 指标详表（本期 vs 上期 vs 达标线）</h3>
    <div style="overflow-x:auto"><table class="tbl" style="font-size:13px"><thead><tr><th>指标</th><th>本期</th><th>上期</th><th>达标线(中位)</th><th>环比</th><th>vs达标线</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot"></span>③ 漏斗卡点</h3>
    ${funnelHtml}
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot"></span>④ Top 问题定位</h3>
    ${issuesHtml}
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot"></span>⑤ 本期行动项（${doneN}/${acts.length} 完成）</h3>
    ${actHtml}
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot"></span>⑥ 申诉记录（${appealN}）</h3>
    ${appealHtml}
  </div>
  <div class="card">
    <h3><span class="dot"></span>⑦ 历史趋势</h3>
    ${trendSVG}
  </div>`;
}

  const full=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>复盘报告_${store}_${new Date().toISOString().slice(0,10)}</title><style>${css}</style></head><body><h1>📄 直播复盘报告 · ${store}</h1><div class="dim">生成时间：${new Date().toLocaleString('zh-CN')}</div>${body}</body></html>`;

}

// —— 账号覆盖层（店长/总负责人修改的密码、角色、店铺绑定，统一覆盖内置 USERS 常量）——
function getUserOverrides(){ try{ const o=JSON.parse(localStorage.getItem('liveops_user_overrides')||'{}'); return (o && typeof o==='object' && !Array.isArray(o))?o:{}; }catch(e){ return {}; } }
function saveUserOverrides(o){ localStorage.setItem('liveops_user_overrides', JSON.stringify(o)); }
function setUserOverride(username, patch, by){
  const o=getUserOverrides();
  o[username]=Object.assign({}, o[username], patch, {at:new Date().toLocaleString('zh-CN'), by:by||''});
  saveUserOverrides(o);
}
// —— 禁用账号列表（内置账号无法从常量删除，用禁用标记）——
function getDisabled(){ try{ const d=JSON.parse(localStorage.getItem('liveops_disabled')||'[]'); return Array.isArray(d)?d:[]; }catch(e){ return []; } }
function saveDisabled(d){ localStorage.setItem('liveops_disabled', JSON.stringify(d)); }
function getUsers(){
  let extra=[];
  try{ extra=JSON.parse(localStorage.getItem('liveops_users')||'[]'); }catch(e){ extra=[]; }
  if(!Array.isArray(extra)) extra=[];
  // 内置账号（总负责人 + 店长）始终以 USERS 常量为准；localStorage 仅保留「非内置」的额外账号
  const builtinNames = new Set(USERS.map(u=>u.username));
  const builtinIds = new Set(USERS.map(u=>u.id));
  const extraOnly = extra.filter(u=>u && !builtinNames.has(u.username) && !builtinIds.has(u.id));
  const disabled = new Set(getDisabled());
  const all = USERS.concat(extraOnly).filter(u=>!disabled.has(u.id));
  // 应用覆盖层（密码/角色/店铺/标题）
  const overrides = getUserOverrides();
  all.forEach(u=>{
    const ov=overrides[u.username];
    if(!ov) return;
    if(ov.pwdHash) u.pwdHash=ov.pwdHash;
    if(ov.role && u.role!=='admin') u.role=ov.role;
    if(ov.store && u.role!=='admin') u.store=ov.store;
    if(ov.title && u.role!=='admin') u.title=ov.title;
    u._ovAt=ov.at; u._ovBy=ov.by;
  });
  return all;
}
function saveUsers(u){ localStorage.setItem('liveops_users',JSON.stringify(u)); }

    <div class="callout amber" style="margin-top:14px"><b>⚠️ 说明</b>本应用为前端部署，账号修改默认保存在当前浏览器。若需让<b>所有访问者</b>使用新账号，请将账号信息发给总负责人（江奇文），由我更新内置账号后重新部署。</div>
  </div>

  <div class="card">
    <h3><span class="dot" style="background:var(--cyan)"></span>注册审核 <span class="badge b-cyan">${pending.length} 条待审核</span></h3>
    <div class="desc">访客自助注册的账号在此审核，通过后即可登录使用</div>
    <div id="pendingList">${pending.length===0?'<div class="hint">暂无待审核的注册申请</div>':pending.map(p=>`
      <div class="user-row">
        <div class="av">${p.name[0]}</div>
        <div class="info"><div class="nm">${p.name}</div><div class="rm">申请账号 ${p.username}${p.note?' · '+p.note:''} · ${p.time}</div></div>
        <select class="sel" id="aprole_${p.id}" style="width:120px"><option value="store">店长</option><option value="viewer">只读</option><option value="editor">运营分析</option></select>
        <select class="sel" id="apstore_${p.id}" style="width:150px"><option value="">选店铺</option>${STORES.map(s=>`<option value="${s.store}">${s.store}</option>`).join('')}</select>
        <button class="mini-btn" style="color:var(--cyan);border-color:var(--cyan)" onclick="approveReg('${p.id}')">通过</button>
        <button class="mini-btn" onclick="rejectReg('${p.id}')">驳回</button>
      </div>`).join('')}</div>
    <div class="hint" style="margin-top:10px">通过后申请者即可登录；角色可在右侧下拉选择，选「店长」需绑定店铺。</div>
  </div>

  <div class="card"><h3><span class="dot"></span>权限说明</h3>
    <div class="tbl-wrap"><table><thead><tr><th>权限</th><th>总负责人（江奇文）</th><th>其他账号（店长/运营分析/只读）</th></tr></thead><tbody>
    <tr><td>数据可见范围</td><td class="tnum">✅ 全公司所有店铺</td><td class="tnum">⚠️ 仅自己绑定的店铺</td></tr>
    <tr><td>数据看板</td><td class="tnum">✅ 全公司大盘</td><td class="tnum">✅ 仅本店 + 大盘基准(达标线)</td></tr>
    <tr><td>直播复盘诊断</td><td class="tnum">✅ 任意店铺</td><td class="tnum">✅ 仅本店</td></tr>
    <tr><td>标杆/问题盘点</td><td class="tnum">✅ 全公司</td><td class="tnum">✅ 仅本店判定</td></tr>
    <tr><td>周维度诊断</td><td class="tnum">✅</td><td class="tnum">❌（涉全公司明细）</td></tr>
    <tr><td>导出报告/AI分析</td><td class="tnum">✅</td><td class="tnum">✅（本店）</td></tr>
    <tr><td>配置 DeepSeek / 账号管理</td><td class="tnum">✅</td><td class="tnum">❌</td></tr>
    </tbody></table></div>
    <div class="callout cyan" style="margin-top:12px"><b>数据权限校准说明</b>除总负责人外，所有账号登录后<b>仅能查看自己绑定店铺的数据明细</b>（数据看板、直播复盘、盘点均只显示本店），同时保留<b>全公司大盘基准值</b>（各指标中位数/达标线、分位数）用于对比定位自身强弱项，<b>不暴露其他店铺的明细数据</b>。</div>
  </div>
  <div class="footer-note">账号安全 · 请勿外传密码 · LiveOps Console</div>`;
}
function addUser(){
  const name=document.getElementById('nu_name').value.trim();
  const username=document.getElementById('nu_user').value.trim();
  const role=document.getElementById('nu_role').value;
  const store=document.getElementById('nu_store').value;
  if(!name||!username){ alert('请填写姓名和账号'); return; }
  if(!store){ alert('请选择绑定的店铺（除总负责人外，所有账号均需绑定店铺）'); return; }
  const users=getUsers();
  if(users.find(u=>u.username===username)){ alert('账号已存在'); return; }
  users.push({id:'u_'+Date.now(),username:username,name:name,role:role,store:store,title:(ROLE_LABEL[role]||'店长')+'·'+store,pwdHash:sha256('123456')});
  saveUsers(users); viewAccount(); alert('已添加，初始密码 123456');
}
function delUser(id){
  const u=getUsers().find(x=>x.id===id); if(!u) return;
  if(u.role==='admin'){ alert('总负责人账号不可删除'); return; }
  const builtin=USERS.find(x=>x.id===id);
  if(builtin){
    if(!confirm('确定删除内置账号「'+u.name+'（'+u.username+'）」？\n删除后该店长将无法登录（可后续恢复）。')) return;
    const d=getDisabled(); if(!d.includes(id)) d.push(id); saveDisabled(d); viewAccount(); alert('已删除（禁用）账号「'+u.name+'」');
  } else {
    if(!confirm('确定删除账号「'+u.name+'（'+u.username+'）」？')) return;
    const users=getUsers().filter(x=>x.id!==id); saveUsers(users); viewAccount();
  }
}
function resetPwd(id){
  const u=getUsers().find(x=>x.id===id); if(!u) return;
  const np=prompt('为「'+u.name+'（'+u.username+'）」设置新密码（至少6位）：');
  if(!np||np.length<6){ alert('密码至少6位'); return; }
  setUserOverride(u.username, {pwdHash:sha256(np)}, '总负责人重置');
  viewAccount(); alert('已为「'+u.name+'」设置新密码，下次登录用新密码。');
}
function changeUserRole(id){
  const u=getUsers().find(x=>x.id===id); if(!u) return;
  if(u.role==='admin'){ alert('总负责人角色不可调整'); return; }
  const roles=['store','editor','viewer'];
  const cur=roles.indexOf(u.role);
  const menu='选择新角色：\n1. 店长（可诊断本店）\n2. 运营分析（仅本店）\n3. 只读（仅查看本店）';
  const ch=prompt('调整「'+u.name+'」的角色（当前：'+ROLE_LABEL[u.role]+'）：\n\n'+menu);
  if(!ch) return;
  const idx=parseInt(ch,10)-1; if(isNaN(idx)||idx<0||idx>2){ alert('编号无效'); return; }
  const role=roles[idx];
  const store=prompt('绑定店铺（该账号登录后仅能查看此店铺）：', u.store||'');
  if(role!=='viewer' && !store){ alert('店长/运营分析需绑定店铺'); return; }
  setUserOverride(u.username, {role:role, store:store||u.store, title:(ROLE_LABEL[role]||role)+'·'+(store||u.store||'')}, '总负责人调整');
  viewAccount(); alert('已调整「'+u.name+'」角色为 '+ROLE_LABEL[role]);
}
function changeUserStore(id){
  const u=getUsers().find(x=>x.id===id); if(!u) return;
  if(u.role==='admin'){ alert('总负责人无需绑定店铺'); return; }
  const store=prompt('为「'+u.name+'」绑定店铺（登录后仅能查看此店铺）：', u.store||'');
  if(!store){ alert('请填写店铺名'); return; }
  setUserOverride(u.username, {store:store, title:(ROLE_LABEL[u.role]||'店长')+'·'+store}, '总负责人调整');
  viewAccount(); alert('已更新「'+u.name+'」的绑定店铺为 '+store);
}
// —— 店长自助修改密码 ——
function changeMyPwd(){
  const me=getUsers().find(u=>u.id===session.id);
  if(!me){ alert('未登录'); return; }
  const old=prompt('请输入当前密码：');
  if(!old) return;
  if(sha256(old)!==me.pwdHash){ alert('当前密码错误'); return; }
  const np=prompt('请输入新密码（至少6位）：');
  if(!np||np.length<6){ alert('密码至少6位'); return; }
  const np2=prompt('再次确认新密码：');
  if(np!==np2){ alert('两次输入不一致'); return; }
  setUserOverride(session.username, {pwdHash:sha256(np)}, '本人修改');
  alert('✅ 密码修改成功，下次登录请用新密码。');
}
// —— 忘记密码 ——
function forgotPwd(){
  alert('忘记密码请联系总负责人（江奇文）重置：\n\n总负责人登录后进入「账号管理」，可为任何账号设置新密码。\n重置后即可用新密码登录。');
}
function approveReg(id){
  const pending=getPending(); const app=pending.find(x=>x.id===id); if(!app){ return; }
  const roleSel=document.getElementById('aprole_'+id); const role=roleSel?roleSel.value:'store';
  const storeSel=document.getElementById('apstore_'+id); const store=storeSel?storeSel.value:'';
  if(!store){ alert('请选择绑定的店铺'); return; }
  const users=getUsers();
  users.push({id:'u_'+Date.now(), username:app.username, name:app.name, role:role, store:store, title:(ROLE_LABEL[role]||'店长')+'·'+store, pwdHash:app.pwdHash});
  saveUsers(users);
  savePending(pending.filter(x=>x.id!==id));
  alert('已通过「'+app.name+'」的注册申请，角色：'+ROLE_LABEL[role]);
  viewAccount();
}
function rejectReg(id){
  const pending=getPending(); const app=pending.find(x=>x.id===id); if(!app){ return; }
  if(!confirm('确认驳回「'+app.name+'」的注册申请？')) return;
  savePending(pending.filter(x=>x.id!==id));
  viewAccount();
}

// ================= 启动 =================
loadSession();
if(session){ enterApp(); } else { document.getElementById('app').style.display='none'; }
</script>
